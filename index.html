<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#a8342a">
  <title>Chinese Chatbox · 中文聊天室</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <h1 id="title">Chinese Chatbox</h1>
        <button id="mode-chip" class="mode-chip">Offline tutor</button>
      </div>
      <div class="langs" title="Interface language">
        <button class="lang-btn" data-lang="zh">中文</button>
        <button class="lang-btn on" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="it">IT</button>
      </div>
      <button id="settings-btn" class="icon" title="Settings">⚙</button>
      <div class="progress">
        <div class="bar"><div id="progress-bar"></div></div>
        <span id="progress">Progress 0/66</span>
      </div>
    </header>

    <main id="messages"></main>

    <div class="dock">
      <div class="chips">
        <button id="chip-drill" class="chip primary">Start drilling</button>
        <button id="chip-review" class="chip">Review</button>
        <button id="chip-lessons" class="chip">Lessons</button>
        <button id="chip-help" class="chip">Help</button>
      </div>

      <div id="transcript" class="transcript" hidden></div>

      <div class="voice-row">
        <div class="voice-langs" id="voice-langs">
          <span id="voice-lang-label" class="vl-label">I speak</span>
          <button class="vl on" data-vlang="zh">中文</button>
          <button class="vl" data-vlang="en">EN</button>
          <button class="vl" data-vlang="it">IT</button>
        </div>
        <button id="mic" class="mic" type="button">
          <span class="mic-glyph">🎤</span>
          <span id="mic-label" class="mic-label">Speak Chinese</span>
        </button>
        <button id="kbd" class="icon kbd" type="button" title="Type instead">⌨</button>
      </div>

      <div id="voice-status" class="voice-status"></div>

      <div class="voice-toggles">
        <label><input type="checkbox" id="handsfree"><span id="handsfree-label">Hands-free</span></label>
        <label><input type="checkbox" id="autospeak" checked><span id="autospeak-label">Read replies aloud</span></label>
      </div>

      <form id="form" hidden>
        <textarea id="input" rows="1" placeholder="Type in Chinese, English or Italian…"></textarea>
        <button id="send" type="submit">Send</button>
      </form>
    </div>
  </div>

  <dialog id="settings">
    <h2 id="settings-title">Settings</h2>

    <label class="field">
      <span id="mode-label">Mode</span>
      <select id="mode">
        <option value="offline">Offline tutor</option>
        <option value="direct">Claude, direct</option>
        <option value="server">Local server</option>
      </select>
    </label>

    <label class="field">
      <span id="key-label">Anthropic API key</span>
      <input id="api-key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-…">
    </label>
    <p id="key-warn" class="warn"></p>

    <label class="field">
      <span id="server-label">Server address</span>
      <input id="server-url" type="text" spellcheck="false" placeholder="http://localhost:8787">
    </label>

    <label class="check">
      <input id="showall" type="checkbox">
      <span id="showall-label">Show all three languages</span>
    </label>

    <h3 id="account-title" class="section">Account &amp; sync</h3>
    <div id="account-out">
      <label class="field">
        <span id="email-label">Email address</span>
        <input id="email" type="email" autocomplete="email" spellcheck="false" placeholder="you@example.com">
      </label>
      <label class="field">
        <span id="password-label">Password</span>
        <input id="password" type="password" autocomplete="current-password">
      </label>
      <button id="sign-in" class="wide primary" type="button">Sign in</button>
      <p id="password-hint" class="hint"></p>
      <button id="send-link" class="wide" type="button">Email me a link instead</button>
    </div>
    <div id="account-in" hidden>
      <p id="signed-in" class="signed-in"></p>
      <button id="sign-out" class="wide" type="button">Sign out</button>
    </div>
    <p id="account-status" class="account-status"></p>

    <div class="actions"><button id="settings-close" type="button">Close</button></div>
  </dialog>

  <script src="src/config.js"></script>
  <script src="src/identity.js"></script>
  <script src="src/i18n.js"></script>
  <script src="src/curriculum.js"></script>
  <script src="src/tutor.js"></script>
  <script src="src/prompt.js"></script>
  <script src="src/voice.js"></script>
  <script src="src/sync.js"></script>
  <script src="src/providers.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
